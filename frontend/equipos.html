<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGAS - Gestión de Equipos</title>
    <link rel="stylesheet" href="assets/css/style_equipos.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <!-- Estilos extra para el modal de vista previa -->
    <style>
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,.55); z-index: 999;
            justify-content: center; align-items: center;
        }
        .modal-overlay.activo { display: flex; }
        .modal-box {
            background: white; width: 90%; max-width: 860px;
            max-height: 85vh; border-radius: 6px;
            display: flex; flex-direction: column;
            overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,.3);
        }
        .modal-header {
            background: #6a1b31; color: white; padding: 14px 20px;
            display: flex; justify-content: space-between; align-items: center; font-weight: bold;
        }
        .modal-header button { background:none;border:none;color:white;font-size:1.4rem;cursor:pointer; }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
        .modal-footer { padding:12px 20px; border-top:1px solid #eee; display:flex; justify-content:flex-end; gap:10px; }
        .btn-descargar { background:#6a1b31;color:white;border:none;padding:10px 22px;font-weight:bold;cursor:pointer;border-radius:4px; }
        .btn-cerrar-modal { background:#6c757d;color:white;border:none;padding:10px 22px;font-weight:bold;cursor:pointer;border-radius:4px; }
        #previewTable table { width:100%;border-collapse:collapse;font-size:.82rem; }
        #previewTable th { background:#6a1b31;color:white;padding:8px 10px;text-align:left; }
        #previewTable td { padding:7px 10px;border-bottom:1px solid #eee; }
        .preview-titulo { font-size:1.1rem;font-weight:bold;color:#6a1b31;margin-bottom:4px; }
        .preview-meta { font-size:.8rem;color:#888;margin-bottom:16px; }
    </style>
</head>
<body>
 
<!-- HEADER -->
<header class="header-institucional">
    <div class="logos-container">
        <img src="assets/IMG/Logo_TEC2.png"  alt="Logo ITS"   class="logo-img">
        <h1>Instituto Tecnológico de Saltillo</h1>
        <img src="assets/IMG/TecNM_logo.png" alt="Logo TecNM" class="logo-img">
    </div>
    <div class="banner-maroon">
        <span><a href="menu.html" style="color:white;text-decoration:none;">Menú</a></span>
        <span>Gestión de Equipos</span>
    </div>
</header>
 
<!-- FORM -->
<main class="container">
    <section class="form-section">
        <div class="grid-inputs" style="display:grid;grid-template-columns:1fr 1fr;gap:15px;flex:2;">
 
            <div class="field">
                <label>Salón</label>
                <select id="salon" class="form-select">
                    <option value="">Seleccione un salón...</option>
                </select>
            </div>
 
            <div class="field">
                <label>Fecha de Entrada</label>
                <input type="date" id="fecha">
            </div>
 
            <div class="field">
                <label>Nombre del Equipo</label>
                <input type="text" id="nombreEquipo" placeholder="Ej: Laptop Dell">
            </div>
 
            <div class="field">
                <label>Clave Única del Equipo</label>
                <input type="text" id="clave" placeholder="Ej: EQ-2024-001">
            </div>
 
            <div class="field">
                <label>Tipo de Equipo</label>
                <input type="text" id="tipo" placeholder="Ej: Laptop, Proyector...">
            </div>
 
            <div class="field">
                <label>Componentes (Ctrl+Click para varios)</label>
                <select id="componentes" class="form-select" multiple style="height:80px;"></select>
            </div>
 
            <div class="field" style="grid-column:span 2;">
                <label>Motivo de Alta / Baja</label>
                <textarea id="motivo" placeholder="Escriba el motivo del movimiento..."
                    style="height:60px;padding:10px;border:1px solid #ccc;background:#e9e9e9;resize:none;font-family:inherit;"></textarea>
            </div>
 
        </div>
 
        <!-- Botones -->
        <div class="actions-container" style="display:flex;flex-direction:column;align-items:stretch;gap:10px;min-width:160px;">
            <div id="statusIndicator" style="font-weight:bold;font-size:1.1em;min-height:28px;text-align:center;"></div>
            <button type="button" id="btnGuardar"    class="btn-action" style="background:#6a1b31;color:white;">Guardar</button>
            <button type="button" id="btnActualizar" class="btn-action" disabled>Actualizar</button>
            <button type="button" id="btnBorrar"     class="btn-action" disabled>Borrar</button>
            <button type="button" id="btnPDF"        class="btn-action" style="background:#2c3e50;color:white;">Ver Reporte</button>
            <a href="fallas.html" style="text-align:center;padding:10px;background:#e8a900;color:white;font-weight:bold;text-decoration:none;font-size:.85rem;border-radius:2px;">
                ⚠ Registrar Falla
            </a>
        </div>
    </section>
 
    <!-- TABLA -->
    <section class="table-section">
        <h2 class="table-title">Equipos Activos</h2>
        <div class="table-wrapper">
            <table id="tabla-equipos">
                <thead>
                    <tr>
                        <th>Clave</th>
                        <th>Nombre</th>
                        <th>Salón</th>
                        <th>Tipo</th>
                        <th>Fecha Entrada</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>
</main>
 
<!-- MODAL VISTA PREVIA -->
<div class="modal-overlay" id="modalEquipos">
    <div class="modal-box">
        <div class="modal-header">
            <span>Vista Previa — Inventario de Equipos</span>
            <button onclick="document.getElementById('modalEquipos').classList.remove('activo')">✕</button>
        </div>
        <div class="modal-body">
            <div id="previewTable"></div>
        </div>
        <div class="modal-footer">
            <button class="btn-cerrar-modal" onclick="document.getElementById('modalEquipos').classList.remove('activo')">Cerrar</button>
            <button class="btn-descargar" onclick="descargarPDFEquipos()">⬇ Descargar PDF</button>
        </div>
    </div>
</div>
 
<script src="assets/js/gestionar_equipos.js"></script>
</body>
</html>
