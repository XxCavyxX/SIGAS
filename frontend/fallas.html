<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGAS - Login TecNM</title>
    <link rel="stylesheet" href="assets/CSS/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <div class="header">
                <img src="assets/IMG/Logo_TEC2.png" alt="Logo TecNM" class="logo">
                <h1>SIGAS</h1>
                <p>Sistema de Gestión de Activos</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="correo">Correo Institucional</label>
                    <input type="text" id="correo" name="correo" placeholder="usuario@saltillo.tecnm.mx">
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="pass" placeholder="••••••••">
                </div>

                <button type="submit" class="btn-login">Entrar al Sistema</button>
            </form>

            <div class="footer">
                <span>TecNM - Instituto Tecnológico de Saltillo</span>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');

        // ── Toast reutilizable ───────────────────────────────────────────
        const ToastError = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 3500,
            timerProgressBar: true
        });

        // ── Validación de formato de correo (cubre todos los casos del PDF) ─
        function validarCorreo(correo) {

            // CASO: sin @ en el correo
            if (!correo.includes('@')) {
                return {
                    valido: false,
                    mensaje: `Incluye un signo de @ en la dirección de correo electrónico. La dirección "${correo}" no incluye el signo de "@"`
                };
            }

            const partes  = correo.split('@');
            const local   = partes[0];          // parte ANTES del @
            const dominio = partes[1];           // parte DESPUÉS del @

            // CASO: caracteres inválidos ANTES del @
            // Permitidos: letras, números, puntos, guiones y guiones bajos
            const regexLocal = /^[a-zA-Z0-9._\-]+$/;
            if (!local || !regexLocal.test(local)) {
                return {
                    valido: false,
                    mensaje: 'Correo no aceptado: caracteres inválidos antes del @'
                };
            }

            // CASO: caracteres inválidos DESPUÉS del @
            // Permitidos: letras, números, puntos y guiones, con al menos un punto y extensión
            const regexDominio = /^[a-zA-Z0-9.\-]+\.[a-zA-Z]{2,}$/;
            if (!dominio || !regexDominio.test(dominio)) {
                return {
                    valido: false,
                    mensaje: 'Caracteres inválidos después del @'
                };
            }

            // Correo aceptado
            return { valido: true };
        }

        // ── Submit del formulario ────────────────────────────────────────
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const correoInput = document.getElementById('correo');
            const passInput   = document.getElementById('password');
            const correo      = correoInput.value.trim();
            const pass        = passInput.value;

            // CASO: ambos campos vacíos
            if (!correo && !pass) {
                ToastError.fire({ icon: 'warning', title: 'Completa este campo' });
                correoInput.focus();
                return;
            }

            // CASO: solo correo vacío
            if (!correo) {
                ToastError.fire({ icon: 'warning', title: 'Completa este campo' });
                correoInput.focus();
                return;
            }

            // CASO: contraseña vacía
            if (!pass) {
                ToastError.fire({ icon: 'warning', title: 'Completar este campo' });
                passInput.focus();
                return;
            }

            // CASO: validaciones de formato del correo
            const validacion = validarCorreo(correo);
            if (!validacion.valido) {
                ToastError.fire({ icon: 'warning', title: validacion.mensaje });
                correoInput.select();
                return;
            }

            // ── Fetch al backend ─────────────────────────────────────────
            try {
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo, pass })
                });

                const contentType = response.headers.get('content-type');

                if (contentType && contentType.includes('application/json')) {
                    const result = await response.json();

                    if (result.success) {
                        localStorage.setItem('userRole',    result.user.Roles_ID_roles);
                        localStorage.setItem('userCorreo',  result.user.Correo);
                        localStorage.setItem('showWelcome', 'true');
                        window.location.href = 'menu.html';
                    } else {
                        // CASO: correo no registrado O contraseña incorrecta
                        ToastError.fire({
                            icon: 'error',
                            title: result.message || 'Credenciales invalidas'
                        });
                        passInput.value = ''; // Borrar solo contraseña
                        passInput.focus();
                    }
                } else {
                    console.error('El servidor no respondió con JSON');
                }

            } catch (error) {
                console.error('Error al conectar:', error);
                ToastError.fire({
                    icon: 'error',
                    title: 'No hay conexión con el servidor'
                });
            }
        });
    </script>
</body>
</html>
