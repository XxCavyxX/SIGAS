<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGAS - Menú Principal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --guindo: #6a1b31; --gold: #b39055; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: #f4f4f4; }
 
        .header-institucional { background: white; border-bottom: 3px solid var(--gold); }
        .logos-container { display:flex; justify-content:space-between; align-items:center; padding:10px 50px; }
        .logos-container h1 { font-size:1.3rem; color:#333; }
        .logo-img { height:60px; object-fit:contain; }
        .banner-maroon {
            background: var(--guindo); color:white;
            padding:10px 25px; display:flex;
            justify-content:space-between; font-weight:bold;
            text-transform:uppercase; letter-spacing:1px;
        }
        .banner-maroon a { color:white; text-decoration:none; }
 
        .container { max-width:900px; margin:40px auto; padding:0 20px; }
        
        .welcome-box {
            background: white; border-radius:8px;
            padding:24px 30px; margin-bottom:30px;
            border-left: 5px solid var(--guindo);
            box-shadow: 0 2px 8px rgba(0,0,0,.07);
        }
        .welcome-box h2 { color: var(--guindo); margin-bottom:4px; }
        .welcome-box p  { color:#666; font-size:.9rem; }
 
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 18px;
        }
 
        .menu-card {
            background: white;
            border-radius: 8px;
            padding: 24px 18px;
            text-align: center;
            text-decoration: none;
            color: #333;
            border: 1px solid #e0e0e0;
            border-top: 4px solid var(--guindo);
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
            transition: transform .2s, box-shadow .2s;
            cursor: pointer;
        }
        .menu-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 18px rgba(106,27,49,.18);
        }
        .menu-card .icono { font-size: 2rem; margin-bottom: 10px; }
        .menu-card span   { font-weight: 600; font-size: .95rem; }
 
        .btn-salir {
            margin-top: 30px;
            padding: 10px 28px;
            background: var(--guindo);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: .9rem;
        }
        .btn-salir:hover { background: #4d1022; }
    </style>
</head>
<body>
 
<header class="header-institucional">
    <div class="logos-container">
        <img src="assets/IMG/Logo_TEC2.png"  alt="Logo ITS"   class="logo-img">
        <h1>Instituto Tecnológico de Saltillo</h1>
        <img src="assets/IMG/TecNM_logo.png" alt="Logo TecNM" class="logo-img">
    </div>
    <div class="banner-maroon">
        <span>SIGAS</span>
        <span>Menú Principal</span>
    </div>
</header>
 
<div class="container">
    <div class="welcome-box">
        <h2 id="titulo-bienvenida">Bienvenido al Sistema</h2>
        <p id="subtitulo-rol">Selecciona un módulo para continuar.</p>
    </div>
 
    <div class="menu-grid" id="contenedor-opciones">
        <!-- Generado por JS según rol -->
    </div>
 
    <button class="btn-salir" onclick="cerrarSesion()">Cerrar Sesión</button>
</div>
 
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const rol    = localStorage.getItem('userRole');
    const correo = localStorage.getItem('userCorreo');
    const showWelcome = localStorage.getItem('showWelcome');
 
    // Mensaje de bienvenida
    if (showWelcome === 'true') {
        const Toast = Swal.mixin({
            toast: true, position: 'top-end',
            showConfirmButton: false, timer: 3500, timerProgressBar: true
        });
        Toast.fire({ icon: 'success', title: `¡Bienvenido! ${correo || ''}` });
        localStorage.removeItem('showWelcome');
    }
 
    // Título según rol
    if (rol == '1') {
        document.getElementById('titulo-bienvenida').textContent = 'Panel de Administrador';
        document.getElementById('subtitulo-rol').textContent = 'Tienes acceso completo al sistema.';
    }
 
    // Módulos según rol
    const contenedor = document.getElementById('contenedor-opciones');
    const modulos = obtenerModulos(rol);
    modulos.forEach(m => {
        const card = document.createElement('a');
        card.className  = 'menu-card';
        card.href       = m.url;
        card.innerHTML  = `<div class="icono">${m.icono}</div><span>${m.nombre}</span>`;
        contenedor.appendChild(card);
    });
});
 
function obtenerModulos(rol) {
    // Módulos disponibles para todos
    const base = [
        { nombre: 'Equipos',     url: 'equipos.html',       icono: '🖥️' },
        { nombre: 'Fallas',      url: 'fallas.html',        icono: '⚠️' },
        { nombre: 'Reportes',    url: 'reportes.html',      icono: '📊' },
    ];
    // Módulos solo para administrador (rol 1)
    const admin = [
        { nombre: 'Usuarios',       url: 'usuarios.html',      icono: '👥' },
        { nombre: 'Departamentos',  url: 'departamentos.html', icono: '🏢' },
        { nombre: 'Roles',          url: 'roles.html',         icono: '🔑' },
    ];
    return rol == '1' ? [...base, ...admin] : base;
}
 
function cerrarSesion() {
    Swal.fire({
        title: '¿Cerrar sesión?',
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#6a1b31',
        confirmButtonText: 'Sí, salir',
        cancelButtonText: 'Cancelar'
    }).then(r => {
        if (r.isConfirmed) {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    });
}
</script>
</body>
</html>
